version: "3.9"

services:
  app:
    build: .
    container_name: pdf-splitter-app
    ports:
      - "8080:8080"
    # Mount the project using a relative path to the repository root
    volumes:
      - .:/workspace:rw
    working_dir: /workspace

  run-sample:
    image: alpine:3.19
    container_name: pdf-splitter-sample
    depends_on:
      - app
    volumes:
      - .:/workspace:rw
    working_dir: /workspace
    entrypoint: ["/bin/sh","/workspace/scripts/run-sample.sh"]
